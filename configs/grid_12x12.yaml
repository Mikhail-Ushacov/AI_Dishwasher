simulation:
  max_steps: 1000
  max_inventory: 1
  max_orders: 3
  order_ttl: 240
  order_spawn_rate: 0.4
  time_step_penalty: -0.01
  collision_penalty: -0.1
  failure_penalty: -0.1
  expired_penalty: 2.0
  success_reward: 20.0
  subgoal_reward: 0.0

grid:
  width: 12
  height: 12
  start_pos: [4, 4]
  stations:
    potato_source: {x: 0, y: 0, type: source, name: PotatoBin, item_id: 1}
    tomato_source: {x: 5, y: 0, type: source, name: TomatoBin, item_id: 3}
    garbage_source: {x: 10, y: 0, type: source, name: Garbage, item_id: 0}
    stove: {x: 5, y: 5, type: process, name: Stove}
    cutboard: {x: 5, y: 6, type: process, name: CutBoard}
    delivery: {x: 5, y: 10, type: delivery, name: ServiceWindow}

items:
  0: Empty
  1: RawPotato
  2: CookedPotato
  3: RawTomato
  4: SlicedTomato

recipes:
  - input: 1
    station: Stove
    output: 2
    time: 15
  - input: 3
    station: CutBoard
    output: 4
    time: 8
