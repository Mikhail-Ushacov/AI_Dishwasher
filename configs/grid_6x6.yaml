simulation:
  max_steps: 1000
  time_step_penalty: -0.01
  collision_penalty: -0.1
  failure_penalty: -0.01
  expired_penalty: 10.0
  success_reward: 20.0
  subgoal_reward: 1.0
  
  # Progressive reward multipliers
  pickup_multiplier: 1.0
  place_multiplier: 2.0
  retrieve_multiplier: 2.0
  
  max_inventory: 1
  max_orders: 3
  order_ttl: 60
  order_spawn_rate: 0.4

grid:
  width: 6
  height: 6
  start_pos: [1, 1]
  stations:
    potato_source: {x: 0, y: 0, type: source, name: PotatoBin, item_id: 1}
    tomato_source: {x: 2, y: 0, type: source, name: TomatoBin, item_id: 3}
    garbage_source: {x: 4, y: 0, type: source, name: GarbageBin, item_id: 0}
    stove: {x: 2, y: 2, type: process, name: Stove}
    cutboard: {x: 2, y: 3, type: process, name: CutBoard}
    delivery: {x: 2, y: 4, type: delivery, name: ServiceWindow}

items:
  0: Empty
  1: RawPotato
  2: CookedPotato
  3: RawTomato
  4: SlicedTomato

recipes:
  - input: 1
    station: Stove
    output: 2
    time: 15
  - input: 3
    station: CutBoard
    output: 4
    time: 8
